version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: quantum_route_postgres
    environment:
      POSTGRES_USER: quantum_user
      POSTGRES_PASSWORD: quantum_password
      POSTGRES_DB: quantum_route_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum_user -d quantum_route_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quantum_net

  redis:
    image: redis:7-alpine
    container_name: quantum_route_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quantum_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: quantum_route_backend
    environment:
      - DATABASE_URL=postgresql://quantum_user:quantum_password@postgres:5432/quantum_route_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_ALWAYS_EAGER=False
      - SECRET_KEY=quantum_production_super_secret_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quantum_net

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: quantum_route_celery
    command: celery -A backend.celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://quantum_user:quantum_password@postgres:5432/quantum_route_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quantum_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quantum_route_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quantum_net

  nginx:
    image: nginx:alpine
    container_name: quantum_route_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - quantum_net

  prometheus:
    image: prom/prometheus:latest
    container_name: quantum_route_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - quantum_net

  grafana:
    image: grafana/grafana:latest
    container_name: quantum_route_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - quantum_net

volumes:
  pgdata:
  redisdata:

networks:
  quantum_net:
    driver: bridge
