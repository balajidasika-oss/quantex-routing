apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-backend-deployment
  labels:
    app: quantum-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantum-backend
  template:
    metadata:
      labels:
        app: quantum-backend
    spec:
      containers:
        - name: backend
          image: quantum_route_ai_backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: quantum-route-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: quantum-backend-service
spec:
  type: ClusterIP
  selector:
    app: quantum-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-frontend-deployment
  labels:
    app: quantum-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantum-frontend
  template:
    metadata:
      labels:
        app: quantum-frontend
    spec:
      containers:
        - name: frontend
          image: quantum_route_ai_frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: quantum-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: quantum-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
