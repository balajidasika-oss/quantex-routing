services:
  - type: web
    name: quantex-routing-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: QISKIT_IBM_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://quantex-routing2.vercel.app,https://quantex-routing1.vercel.app
      - key: REDIS_URL
        sync: false
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      - key: USE_IN_MEMORY_REDIS_FALLBACK
        value: "True"

