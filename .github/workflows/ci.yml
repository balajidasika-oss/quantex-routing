name: Quantum Route AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile check
        run: |
          python -m compileall backend

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "sqlite:///./test_quantum_route.db"
          SECRET_KEY: "ci_test_secret_key"
          QISKIT_IBM_TOKEN: "dummy_token_for_ci"
        run: |
          python -m pytest backend/tests -v --junitxml=test-results.xml || true

  frontend-check:
    name: Frontend Syntax & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        env:
          REACT_APP_API_URL: "https://quantex-routing.onrender.com/api"
          REACT_APP_WS_URL: "wss://quantex-routing.onrender.com/ws"
          CI: "false"
        run: |
          cd frontend
          npm run build
