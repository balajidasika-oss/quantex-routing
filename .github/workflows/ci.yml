name: Quantum Route AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r quantum_route_ai/backend/requirements.txt

      - name: Compile check
        run: |
          python -m compileall quantum_route_ai/backend

      - name: Run Pytest Suite
        run: |
          cd quantum_route_ai
          python -m pytest backend/tests -v --junitxml=test-results.xml

      - name: Run Standalone Benchmark CLI
        run: |
          python quantum_route_ai/reports/report_generator.py --benchmark

  frontend-check:
    name: Frontend Syntax & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          cd quantum_route_ai/frontend
          npm install

      - name: Build frontend
        run: |
          cd quantum_route_ai/frontend
          npm run build
